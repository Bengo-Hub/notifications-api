basePath: /api/v1
definitions:
  github_com_bengobox_notifications-api_internal_modules_announcements.Input:
    properties:
      audience:
        type: string
      cta_label:
        type: string
      cta_url:
        type: string
      dismissible:
        type: boolean
      ends_at:
        type: string
      highlights:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      priority:
        type: integer
      services:
        items:
          type: string
        type: array
      starts_at:
        type: string
      summary:
        type: string
      title:
        type: string
      tone:
        type: string
    type: object
  github_com_bengobox_notifications-api_internal_modules_broadcasts.Content:
    properties:
      email:
        $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_broadcasts.EmailContent'
      in_app:
        $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_broadcasts.InAppContent'
      push:
        $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_broadcasts.PushContent'
      sms:
        $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_broadcasts.SMSContent'
      whatsapp:
        $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_broadcasts.WhatsAppContent'
    type: object
  github_com_bengobox_notifications-api_internal_modules_broadcasts.EmailContent:
    properties:
      body:
        type: string
      subject:
        type: string
    type: object
  github_com_bengobox_notifications-api_internal_modules_broadcasts.InAppContent:
    properties:
      audience:
        description: all | admins
        type: string
      cta_label:
        type: string
      cta_url:
        type: string
      days:
        description: how long the banner shows, default 7
        type: integer
      services:
        items:
          type: string
        type: array
      summary:
        type: string
      title:
        type: string
      tone:
        type: string
    type: object
  github_com_bengobox_notifications-api_internal_modules_broadcasts.Input:
    properties:
      audience:
        additionalProperties: {}
        type: object
      channels:
        items:
          type: string
        type: array
      class:
        type: string
      consent_attested:
        type: boolean
      content:
        $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_broadcasts.Content'
      kind:
        type: string
      send_at:
        type: string
      sender_name:
        description: Sender-facing settings kept in metadata.
        type: string
      timezone:
        type: string
      title:
        type: string
    type: object
  github_com_bengobox_notifications-api_internal_modules_broadcasts.PushContent:
    properties:
      body:
        type: string
      title:
        type: string
    type: object
  github_com_bengobox_notifications-api_internal_modules_broadcasts.SMSContent:
    properties:
      body:
        type: string
    type: object
  github_com_bengobox_notifications-api_internal_modules_broadcasts.WhatsAppContent:
    properties:
      message:
        type: string
      params:
        items:
          type: string
        type: array
      template:
        type: string
    type: object
  github_com_bengobox_notifications-api_internal_modules_templates.TemplateSummary:
    properties:
      category:
        type: string
      channel:
        type: string
      description:
        type: string
      filePath:
        type: string
      id:
        type: string
      mimeType:
        type: string
      name:
        type: string
      tags:
        items:
          type: string
        type: array
      variables:
        items:
          type: string
        type: array
    type: object
  github_com_bengobox_notifications-api_internal_whatsapp_profile.Profile:
    properties:
      about:
        type: string
      address:
        type: string
      description:
        type: string
      display_name:
        description: |-
          DisplayName is Meta's verified_name, NameStatus its review state (APPROVED, PENDING_REVIEW,
          DECLINED, AVAILABLE_WITHOUT_REVIEW, EXPIRED, NONE).
        type: string
      display_phone_number:
        type: string
      email:
        type: string
      name_status:
        type: string
      new_display_name:
        description: NewDisplayName and NewNameStatus describe a requested name change
          still being reviewed.
        type: string
      new_name_status:
        type: string
      phone_number_id:
        type: string
      photo_url:
        type: string
      quality_rating:
        description: QualityRating is GREEN, YELLOW, RED, or NA/UNKNOWN for a number
          with too little traffic.
        type: string
      vertical:
        type: string
      websites:
        items:
          type: string
        type: array
    type: object
  github_com_bengobox_notifications-api_internal_whatsapp_profile.Update:
    properties:
      about:
        type: string
      address:
        type: string
      description:
        type: string
      email:
        type: string
      vertical:
        type: string
      websites:
        items:
          type: string
        type: array
    type: object
  github_com_bengobox_notifications-api_internal_whatsapp_templatesync.Outcome:
    enum:
    - created
    - skipped
    - deleted
    - failed
    - queued
    type: string
    x-enum-varnames:
    - OutcomeCreated
    - OutcomeSkipped
    - OutcomeDeleted
    - OutcomeFailed
    - OutcomeQueued
  github_com_bengobox_notifications-api_internal_whatsapp_templatesync.Result:
    properties:
      category:
        type: string
      detail:
        description: Meta's error message, when Outcome is "failed"
        type: string
      dry_run:
        type: boolean
      meta_reason:
        description: |-
          MetaReason is Meta's rejected_reason for a REJECTED template (e.g. INVALID_FORMAT,
          TAG_CONTENT_MISMATCH), so admins know what to change before submitting a new version.
        type: string
      meta_status:
        description: |-
          MetaStatus is Meta's review status for a template that already exists (APPROVED, PENDING,
          REJECTED, ...), so admins can see whether a submitted template can be sent yet.
        type: string
      name:
        type: string
      outcome:
        $ref: '#/definitions/github_com_bengobox_notifications-api_internal_whatsapp_templatesync.Outcome'
    type: object
  github_com_bengobox_notifications-api_internal_whatsapp_tenanttemplates.StatusReport:
    properties:
      services:
        items:
          type: string
        type: array
      summary:
        additionalProperties:
          type: integer
        type: object
      templates:
        items:
          $ref: '#/definitions/github_com_bengobox_notifications-api_internal_whatsapp_tenanttemplates.TemplateStatus'
        type: array
      waba_id:
        type: string
    type: object
  github_com_bengobox_notifications-api_internal_whatsapp_tenanttemplates.SyncReport:
    properties:
      remaining:
        type: integer
      results:
        items:
          $ref: '#/definitions/github_com_bengobox_notifications-api_internal_whatsapp_templatesync.Result'
        type: array
      services:
        items:
          type: string
        type: array
      summary:
        additionalProperties:
          type: integer
        type: object
      waba_id:
        type: string
    type: object
  github_com_bengobox_notifications-api_internal_whatsapp_tenanttemplates.TemplateStatus:
    properties:
      category:
        type: string
      name:
        type: string
      reason:
        type: string
      status:
        description: |-
          Status is Meta's review status (APPROVED, PENDING, REJECTED, PAUSED, DISABLED ...), or
          MISSING when the template has not been submitted to this WABA.
        type: string
    type: object
  internal_http_handlers.ActivityLogEntry:
    properties:
      channel:
        type: string
      id:
        type: string
      recipient:
        type: string
      status:
        type: string
      templateName:
        type: string
      timestamp:
        type: string
    type: object
  internal_http_handlers.ActivityLogsResponse:
    properties:
      logs:
        items:
          $ref: '#/definitions/internal_http_handlers.ActivityLogEntry'
        type: array
      total:
        type: integer
    type: object
  internal_http_handlers.CreateMessageRequest:
    type: object
  internal_http_handlers.DeliveryStatsResponse:
    properties:
      channelBreakdown:
        additionalProperties:
          type: integer
        type: object
      deliveryRate:
        type: number
      errorRate:
        type: number
      failed:
        type: integer
      scope:
        description: '"tenant" or "platform"'
        type: string
      skipped:
        type: integer
      timeSeries:
        items:
          $ref: '#/definitions/internal_http_handlers.TimeSeriesPoint'
        type: array
      totalSent:
        type: integer
    type: object
  internal_http_handlers.TimeSeriesPoint:
    properties:
      date:
        type: string
      delivered:
        type: integer
      sent:
        type: integer
    type: object
  internal_http_handlers.configureProviderRequest:
    properties:
      environment:
        description: sandbox, production
        type: string
      is_primary:
        type: boolean
      platform_managed_keys:
        items:
          type: string
        type: array
      provider_name:
        description: smtp, brevo, africastalking, meta_cloud, fcm
        type: string
      provider_type:
        description: email, sms, push
        type: string
      secret_keys:
        items:
          type: string
        type: array
      settings:
        additionalProperties:
          type: string
        type: object
    type: object
  internal_http_handlers.configureProviderResponse:
    properties:
      message:
        type: string
      provider_name:
        type: string
      provider_type:
        type: string
    type: object
  internal_http_handlers.deleteTemplatesRequest:
    properties:
      dry_run:
        type: boolean
      prefixes:
        description: required — refuses to run with none, see Delete
        items:
          type: string
        type: array
    type: object
  internal_http_handlers.deleteTemplatesResponse:
    properties:
      results:
        items:
          $ref: '#/definitions/github_com_bengobox_notifications-api_internal_whatsapp_templatesync.Result'
        type: array
      summary:
        additionalProperties:
          type: integer
        type: object
      waba_id:
        type: string
    type: object
  internal_http_handlers.disconnectResult:
    properties:
      deregistered:
        description: Deregistered is true when Meta released the number from Cloud
          API.
        type: boolean
      message:
        type: string
      notes:
        description: Notes explain any Meta step that could not be done, e.g. an account
          already deleted.
        items:
          type: string
        type: array
      unsubscribed:
        description: Unsubscribed is true when our app stopped receiving the account's
          webhooks.
        type: boolean
    type: object
  internal_http_handlers.enqueueResponse:
    properties:
      requestId:
        example: req_123
        type: string
      status:
        example: queued
        type: string
    type: object
  internal_http_handlers.errorResponse:
    properties:
      error:
        example: validation failed
        type: string
    type: object
  internal_http_handlers.listProvidersResponse:
    properties:
      providers:
        items:
          $ref: '#/definitions/internal_http_handlers.providerResponse'
        type: array
    type: object
  internal_http_handlers.livenessResponse:
    properties:
      service:
        example: notifications-api
        type: string
      status:
        example: ok
        type: string
    type: object
  internal_http_handlers.providerResponse:
    properties:
      environment:
        description: sandbox, production
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      provider_name:
        description: smtp, brevo, africastalking, meta_cloud, fcm
        type: string
      provider_type:
        description: email, sms, push
        type: string
      status:
        type: string
    type: object
  internal_http_handlers.providerSettingsResponse:
    properties:
      provider_name:
        type: string
      provider_type:
        type: string
      settings:
        additionalProperties:
          type: string
        type: object
    type: object
  internal_http_handlers.readinessResponse:
    properties:
      dependencies:
        additionalProperties:
          type: string
        type: object
      status:
        example: OK
        type: string
    type: object
  internal_http_handlers.simpleMessageResponse:
    properties:
      message:
        type: string
    type: object
  internal_http_handlers.syncBrandingResponse:
    properties:
      filled:
        description: Filled lists the fields set from the branding ("about", "email",
          "photo" ...).
        items:
          type: string
        type: array
      profile:
        $ref: '#/definitions/github_com_bengobox_notifications-api_internal_whatsapp_profile.Profile'
      warnings:
        description: Warnings explain what could not be used (an SVG logo, a too long
          tagline ...).
        items:
          type: string
        type: array
    type: object
  internal_http_handlers.syncTemplatesRequest:
    properties:
      batch_size:
        description: |-
          BatchSize caps how many templates one call submits (default 5, at most 10); the rest come
          back queued and the caller calls again until remaining is 0.
        type: integer
      dry_run:
        type: boolean
      names:
        description: |-
          Names limits the run to these exact template names: the UI's submit queue sends one batch
          of names per call, so a template Meta refused is not retried by every later batch.
        items:
          type: string
        type: array
      only:
        description: name prefixes, e.g. ["finance_"] — empty means every template
        items:
          type: string
        type: array
    type: object
  internal_http_handlers.syncTemplatesResponse:
    properties:
      remaining:
        type: integer
      results:
        items:
          $ref: '#/definitions/github_com_bengobox_notifications-api_internal_whatsapp_templatesync.Result'
        type: array
      summary:
        additionalProperties:
          type: integer
        type: object
      waba_id:
        type: string
    type: object
  internal_http_handlers.templateGetResponse:
    properties:
      channel:
        type: string
      content:
        type: string
      id:
        type: string
      mimeType:
        type: string
    type: object
  internal_http_handlers.templateTestSendRequest:
    properties:
      channel:
        description: required if not in query
        type: string
      data:
        additionalProperties: {}
        type: object
      to:
        description: required
        items:
          type: string
        type: array
    type: object
  internal_http_handlers.templateUpdateRequest:
    properties:
      content:
        type: string
      subject:
        description: optional, for email channel
        type: string
    type: object
  internal_http_handlers.tenantListItem:
    properties:
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  internal_http_handlers.tenantSyncRequest:
    properties:
      dry_run:
        type: boolean
    type: object
  internal_http_handlers.testProviderRequest:
    properties:
      to:
        description: Email or phone for test message
        type: string
    type: object
  internal_http_handlers.testProviderResult:
    properties:
      error:
        type: string
      message:
        type: string
      provider_name:
        type: string
      provider_type:
        type: string
      success:
        type: boolean
    type: object
  internal_http_handlers.updateProviderRequest:
    properties:
      is_active:
        type: boolean
      settings:
        additionalProperties:
          type: string
        type: object
    type: object
  pagination.Response-github_com_bengobox_notifications-api_internal_modules_templates_TemplateSummary:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_templates.TemplateSummary'
        type: array
      hasMore:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
host: notificationsapi.codevertexafrica.com
info:
  contact: {}
  description: HTTP API for the Codevertex notifications service.
  title: Notifications Service API
  version: 0.1.0
paths:
  /{tenantId}/notifications/messages:
    post:
      consumes:
      - application/json
      description: Accepts a notification payload and queues it for downstream processing.
      parameters:
      - description: Tenant identifier
        in: path
        name: tenantId
        required: true
        type: string
      - description: Message payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_http_handlers.CreateMessageRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_http_handlers.enqueueResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      summary: Queue notification message
      tags:
      - Notifications
  /analytics/delivery:
    get:
      description: 'Returns delivery statistics for the tenant. Query: range (24h,
        7d, 30d). Platform owners may pass a tenant (X-Tenant-ID or the path) or scope=all
        for every tenant.'
      parameters:
      - description: Time range (24h, 7d, 30d)
        in: query
        name: range
        type: string
      - description: all = platform-wide (platform owners only)
        in: query
        name: scope
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.DeliveryStatsResponse'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      summary: Delivery analytics
      tags:
      - Analytics
  /analytics/delivery/{tenantId}:
    get:
      description: 'Returns delivery statistics for the tenant. Query: range (24h,
        7d, 30d). Platform owners may pass a tenant (X-Tenant-ID or the path) or scope=all
        for every tenant.'
      parameters:
      - description: Tenant identifier
        in: path
        name: tenantId
        type: string
      - description: Time range (24h, 7d, 30d)
        in: query
        name: range
        type: string
      - description: all = platform-wide (platform owners only)
        in: query
        name: scope
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.DeliveryStatsResponse'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      summary: Delivery analytics
      tags:
      - Analytics
  /analytics/logs:
    get:
      description: 'Returns paginated delivery log entries with masked recipients.
        Query: limit, offset, channel, status, from, to, scope (all = platform-wide,
        platform owners only).'
      parameters:
      - description: Max results (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Filter by channel
        in: query
        name: channel
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.ActivityLogsResponse'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      summary: Delivery log
      tags:
      - Analytics
  /analytics/logs/{tenantId}:
    get:
      description: 'Returns paginated delivery log entries with masked recipients.
        Query: limit, offset, channel, status, from, to, scope (all = platform-wide,
        platform owners only).'
      parameters:
      - description: Tenant identifier
        in: path
        name: tenantId
        type: string
      - description: Max results (default 20)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      - description: Filter by channel
        in: query
        name: channel
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.ActivityLogsResponse'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      summary: Delivery log
      tags:
      - Analytics
  /announcements:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 'List announcements (platform tenant: every tenant; other tenants:
        their own users)'
      tags:
      - Announcements
    post:
      consumes:
      - application/json
      parameters:
      - description: Announcement
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_announcements.Input'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: 'Publish an announcement (platform tenant: every tenant; other tenants:
        their own users)'
      tags:
      - Announcements
  /announcements/{id}:
    delete:
      parameters:
      - description: Announcement ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: 'Delete an announcement (platform tenant: every tenant; other tenants:
        their own users)'
      tags:
      - Announcements
    put:
      consumes:
      - application/json
      parameters:
      - description: Announcement ID
        in: path
        name: id
        required: true
        type: string
      - description: Announcement
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_announcements.Input'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 'Update an announcement (platform tenant: every tenant; other tenants:
        their own users)'
      tags:
      - Announcements
  /announcements/active:
    get:
      description: The banners an app's dashboard shows now (public, cached). Dismissal
        is per user, client side.
      parameters:
      - description: App key, e.g. pos, treasury, inventory
        in: query
        name: service
        required: true
        type: string
      - description: 'Viewer''s tenant (id or slug): adds that tenant''s own banners'
        in: query
        name: tenant
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 'announcements: []'
          schema:
            additionalProperties: true
            type: object
      summary: Active announcements for an app
      tags:
      - Announcements
  /billing/whatsapp/connection:
    delete:
      description: Deregisters the number and unsubscribes the app on Meta (best effort),
        then removes the tenant's saved connection.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_http_handlers.disconnectResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_http_handlers.errorResponse'
      security:
      - bearerAuth: []
      summary: Disconnect the tenant's WhatsApp number
      tags:
      - WhatsApp
  /broadcasts:
    get:
      parameters:
      - description: Comma separated statuses
        in: query
        name: status
        type: string
      - description: Only occasion greetings
        in: query
        name: occasion
        type: boolean
      - description: Page size (max 100)
        in: query
        name: limit
        type: integer
      - description: Offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List broadcasts
      tags:
      - Broadcasts
    post:
      consumes:
      - application/json
      parameters:
      - description: Broadcast
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_bengobox_notifications-api_internal_modules_broadcasts.Input'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create a broadcast draft
      tags:
      - Broadcasts
  /broadcasts/{id}:
    delete:
      parameters:
      - description: Broadcast ID
        in: path
        name: id
