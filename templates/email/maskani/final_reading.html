{{ define "content" }}
  <p>Hello{{ if .name }} {{ .name }}{{ end }},</p>
  <p>The {{ .role }} of unit {{ .unit_code }} at {{ .estate }} left on {{ .left_on }}. Please take a final reading of meter {{ .meter_serial }} so their last water bill is right.</p>
  {{ if .action_link }}
  <p style="margin:20px 0;">
    <a href="{{ .action_link }}" style="background:{{ or .brand_primary_color "#0F766E" }};color:#ffffff !important;text-decoration:none;padding:10px 16px;border-radius:6px;display:inline-block;">Open readings</a>
  </p>
  {{ end }}
{{ end }}
