{{ define "content" }}
  <div style="background:#fef2f2;border:1px solid #fecaca;padding:12px 16px;border-radius:8px;margin:0 0 16px 0;">
    <p style="margin:0;color:#991b1b;font-weight:600;">Security alert for {{ .estate }}</p>
  </div>
  <p>A <strong>{{ .severity }}</strong> incident has been reported and needs attention now.</p>
  <table role="presentation" style="width:100%;border-collapse:collapse;margin:16px 0;">
    <tr>
      <td style="padding:8px 0;color:#6b7280;width:45%;border-bottom:1px solid #f3f4f6;">Incident</td>
      <td style="padding:8px 0;font-family:monospace;font-size:13px;border-bottom:1px solid #f3f4f6;">{{ .number }}</td>
    </tr>
    <tr>
      <td style="padding:8px 0;color:#6b7280;border-bottom:1px solid #f3f4f6;">What happened</td>
      <td style="padding:8px 0;font-weight:600;border-bottom:1px solid #f3f4f6;">{{ .title }}</td>
    </tr>
    <tr>
      <td style="padding:8px 0;color:#6b7280;">Category</td>
      <td style="padding:8px 0;">{{ or .category "-" }}</td>
    </tr>
  </table>
  {{ if .action_link }}
  <p style="margin:20px 0;">
    <a href="{{ .action_link }}" style="background:{{ or .brand_primary_color "#0F766E" }};color:#ffffff !important;text-decoration:none;padding:10px 16px;border-radius:6px;display:inline-block;">Open incident</a>
  </p>
  {{ end }}
{{ end }}
