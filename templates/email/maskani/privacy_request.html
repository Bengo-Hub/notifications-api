{{ define "content" }}
  <p>Hello,</p>
  <p>{{ .name }} made a privacy request at {{ .estate }}. The law gives the estate until {{ .due_at }} to respond.</p>
  <table role="presentation" style="width:100%;border-collapse:collapse;margin:16px 0;">
    <tr>
      <td style="padding:8px 0;color:#6b7280;width:45%;border-bottom:1px solid #f3f4f6;">Request</td>
      <td style="padding:8px 0;font-weight:600;border-bottom:1px solid #f3f4f6;">{{ .kind }}</td>
    </tr>
    <tr>
      <td style="padding:8px 0;color:#6b7280;width:45%;border-bottom:1px solid #f3f4f6;">Made</td>
      <td style="padding:8px 0;border-bottom:1px solid #f3f4f6;">{{ .source }}</td>
    </tr>
    <tr>
      <td style="padding:8px 0;color:#6b7280;width:45%;border-bottom:1px solid #f3f4f6;">Respond by</td>
      <td style="padding:8px 0;font-weight:600;border-bottom:1px solid #f3f4f6;">{{ .due_at }}</td>
    </tr>
  </table>
  {{ if .action_link }}
  <p style="margin:20px 0;">
    <a href="{{ .action_link }}" style="background:{{ or .brand_primary_color "#0F766E" }};color:#ffffff !important;text-decoration:none;padding:10px 16px;border-radius:6px;display:inline-block;">Open privacy requests</a>
  </p>
  {{ end }}
{{ end }}
