{{ define "content" }}
  <p>Hello {{ .name }},</p>
  <p>Your recent payment attempt for order {{ .order_id }} failed.</p>
  <p>
    <a class="button" href="{{ .retry_link }}">Retry Payment</a>
  </p>
  {{ if .brand_email }}<p class="muted">If you need help, contact {{ .brand_email }}.</p>{{ end }}
{{ end }}
