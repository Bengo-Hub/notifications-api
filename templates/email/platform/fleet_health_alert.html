{{ define "content" }}
  <p>The <strong>fleet-health-watcher</strong> detected an active issue on the production cluster.</p>
  <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
    <tr>
      <td style="background:#DC2626;border-radius:6px;padding:10px 20px;">
        <span style="color:#ffffff;font-weight:600;font-size:13px;">{{ or .summary "Cluster issue detected" }}</span>
      </td>
    </tr>
  </table>
  <pre style="background:#111827;color:#e5e7eb;padding:16px;border-radius:6px;white-space:pre-wrap;font-size:12px;line-height:1.5;">{{ .details }}</pre>
  <p style="color:#6b7280;">Detected at {{ or .detected_at "just now" }} — check the platform monitor dashboard for live status.</p>
{{ end }}
