{{ define "content" }}
  <p>Hello {{ .name }},</p>
  <h2>Update on your ticket</h2>
  <p>Your support ticket <strong>#{{ .ticket_id }}</strong> is now <strong>{{ .status }}</strong>.</p>

  <div style="background:#f3f4f6; padding:16px; border-radius:6px; margin:16px 0;">
    <strong>Subject:</strong> {{ .subject }}
  </div>

  <p>{{ .status_notice }}</p>

  {{ if .action_link }}
  <p>
    <a class="button" href="{{ .action_link }}">Visit our support page</a>
  </p>
  {{ end }}
{{ end }}
