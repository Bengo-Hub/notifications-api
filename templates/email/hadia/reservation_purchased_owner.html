{{ define "content" }}
  <p>Hello {{ or .name "there" }},</p>
  <h2>A gift is on its way</h2>
  <p>{{ .guest }} says they bought <strong>{{ .item }}</strong> from {{ .registry }}.</p>
  <p>When it reaches you, confirm it on your gift log so you know which gifts have arrived.</p>
  {{ if .action_link }}
  <p>
    <a class="button" href="{{ .action_link }}">Confirm it arrived</a>
  </p>
  {{ end }}
{{ end }}
