{{ define "content" }}
  <p>Hello {{ or .name "there" }},</p>
  <h2>A gift was reserved</h2>
  <p>{{ .guest }} reserved <strong>{{ .item }}</strong> from your registry.</p>
  {{ if .action_link }}
  <p>
    <a class="button" href="{{ .action_link }}">View your registry</a>
  </p>
  {{ end }}
{{ end }}
