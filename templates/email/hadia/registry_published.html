{{ define "content" }}
  <p>Hello {{ or .name "there" }},</p>
  <h2>Your registry is live</h2>
  <p><strong>{{ .registry }}</strong> is ready for your guests. Share the link with family and friends so they can reserve gifts or send a contribution.</p>
  {{ if .action_link }}
  <p>
    <a class="button" href="{{ .action_link }}">Open your registry</a>
  </p>
  {{ end }}
{{ end }}
