{{ define "content" }}
  <p>Hello {{ or .name "there" }},</p>
  <h2>Your payout was not made</h2>
  <p>The payout of <strong>{{ .amount }}</strong> from {{ .registry }} was not made, and no money left your registry. Please contact Hadia support, or choose another amount.</p>
  {{ if .action_link }}
  <p>
    <a class="button" href="{{ .action_link }}">View your registry</a>
  </p>
  {{ end }}
{{ end }}
