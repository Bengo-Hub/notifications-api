{{ define "content" }}
  <p>Hello {{ .name }},</p>
  <h2 style="color: #dc2626;">{{ .heading }}</h2>
  {{ if .message }}<p>{{ .message }}</p>{{ end }}

  {{ if .deadline }}
  <div style="background:#fef2f2; border:1px solid #fecaca; padding:16px; border-radius:6px; margin:16px 0;">
    <strong>Act by:</strong> {{ .deadline }}
  </div>
  {{ end }}

  {{ if .action_link }}
  <p>
    <a class="button" href="{{ .action_link }}">{{ or .action_text "Open my account" }}</a>
  </p>
  {{ end }}
{{ end }}
