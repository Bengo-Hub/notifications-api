{{ define "content" }}
  <h2 style="margin:0 0 16px;font-size:20px;color:#111827;">New Rider KYC Submission</h2>
  <div style="background:#FFF3E0;padding:12px 16px;border-radius:8px;border-left:4px solid #FF9800;margin:16px 0;">
    <strong>{{.RiderName}}</strong> ({{.RiderEmail}}) has submitted their KYC documents and is awaiting your review.
  </div>
  <p style="margin:16px 0;color:#374151;">Please review the submitted documents and approve or reject the rider application from your dashboard.</p>
  <div style="text-align:center;margin:24px 0;">
    <a href="{{.ReviewUrl}}" style="display:inline-block;padding:12px 24px;background:{{ or .brand_primary_color "#0F766E" }};color:#ffffff;text-decoration:none;border-radius:6px;font-weight:bold;">Review Application</a>
  </div>
{{ end }}
