{{ define "content" }}
  <h2 style="margin:0 0 16px;font-size:20px;color:#111827;">Application Expired</h2>
  <p style="margin:16px 0;color:#374151;">Hi {{.RiderName}},</p>
  <p style="margin:16px 0;color:#374151;">Your rider application has been automatically removed because it was not reviewed within 7 days.</p>
  <p style="margin:16px 0;color:#374151;">If you are still interested in joining the delivery fleet, you can re-apply using the link below.</p>
  <div style="text-align:center;margin:24px 0;">
    <a href="{{.SignupUrl}}" style="display:inline-block;padding:12px 24px;background:{{ or .brand_primary_color "#0F766E" }};color:#ffffff;text-decoration:none;border-radius:6px;font-weight:bold;">Re-apply Now</a>
  </div>
{{ end }}
